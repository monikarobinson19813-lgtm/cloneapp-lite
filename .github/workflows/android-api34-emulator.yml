name: Android API 34 Emulator CI Infrastructure

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api34-platform-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build CloneApp Lite and deterministic test stub
        run: ./gradlew :app:assembleDebug :teststub:assembleDebug

      - name: Record virtualization-runtime coverage boundary
        shell: bash
        run: |
          echo "API34 x86_64 emulator is CI infrastructure, not product gating."
          echo "Virtual-user install/run is intentionally not exercised here because CloneApp currently crashes in its native ART hidden-API hook before virtualization runtime can be tested."
          echo "No automated virtualization-runtime coverage exists on any architecture; physical arm64 testing remains authoritative."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 34 platform smoke without CloneApp virtualization
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r teststub/build/outputs/apk/debug/teststub-debug.apk
            adb shell pm grant com.cloneapp.teststub android.permission.POST_NOTIFICATIONS

            adb shell am start -W -n com.cloneapp.teststub/.MainActivity --es marker CI-Platform
            adb shell dumpsys activity activities | grep -q "com.cloneapp.teststub/.MainActivity"

            adb shell am start -W -n com.cloneapp.teststub/.SecondActivity --es marker CI-Platform
            adb shell dumpsys activity activities | grep -q "com.cloneapp.teststub/.SecondActivity"

            adb shell am force-stop com.cloneapp.teststub
            adb shell am start -W -n com.cloneapp.teststub/.MainActivity --es marker CI-Platform --es action post_notification
            adb shell dumpsys notification | grep -q "com.cloneapp.teststub"

            adb shell am force-stop com.cloneapp.teststub
            adb shell am start -W -n com.cloneapp.teststub/.MainActivity --es marker CI-Platform --es action open_pdf
            sleep 1
            adb shell dumpsys activity activities | grep -q "com.cloneapp.teststub/.PdfViewerActivity"
            adb logcat -d -s CloneAppTestStub:I '*:S' | grep -q "TESTSTUB_PDF_OK"
