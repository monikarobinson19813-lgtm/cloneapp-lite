name: Android API 34 Emulator Foundation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api34-teststub-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build CloneApp Lite and deterministic test stub
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :teststub:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 34 test-stub smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r teststub/build/outputs/apk/debug/teststub-debug.apk
            adb shell pm grant com.cloneapp.teststub android.permission.POST_NOTIFICATIONS

            echo "Installing CloneApp Lite universal APK"
            adb install -r "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*universal-debug.apk' -print -quit)"
            adb shell pm grant com.cloneapp.lite android.permission.POST_NOTIFICATIONS || true

            adb logcat -c
            adb shell am start -W -n com.cloneapp.lite/top.niunaijun.blackboxa.view.main.MainActivity
            sleep 2
            adb shell pidof com.cloneapp.lite && echo "CLONEAPP_API34_BASE_PROCESS_LIVE" || echo "CLONEAPP_API34_BASE_PROCESS_ABSENT"
            echo "=== CLONEAPP PROCESS SNAPSHOT ==="
            adb shell ps -A | grep -E "com.cloneapp.lite|top.niunaijun|blackbox" || true
            echo "=== RESUMED/TASK SNAPSHOT ==="
            adb shell dumpsys activity activities | grep -E -A 8 -B 4 "mResumedActivity|topResumedActivity|com.cloneapp.lite|com.android.vpndialogs|com.android.settings" | head -n 220 || true
            echo "=== ACTIVITY PROCESS SNAPSHOT ==="
            adb shell dumpsys activity processes | grep -E -A 14 -B 5 "com.cloneapp.lite|top.niunaijun" | head -n 260 || true
            echo "=== APP EXIT INFO ==="
            adb shell dumpsys activity exit-info com.cloneapp.lite || true
            echo "=== ACTIVITY MANAGER / CRASH / NATIVE LOGS ==="
            adb logcat -b all -d -v threadtime | grep -E -A 50 -B 12 "com.cloneapp.lite|am_proc_died|am_kill|am_crash|FATAL EXCEPTION|AndroidRuntime|Fatal signal|SIGSEGV|SIGABRT|UnsatisfiedLinkError|dlopen|linker|NativeLoader|lowmemorykiller|lmkd" | tail -n 420 || true

            echo "Installing CloneApp Lite instrumentation APK"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e class top.niunaijun.blackboxa.VirtualUser0InstallTest com.cloneapp.lite.test/androidx.test.runner.AndroidJUnitRunner
            adb logcat -d -s CloneAppVirtualTest:I '*:S' | grep -q "VIRTUAL_USER_INSTALL_OK user=0 package=com.cloneapp.teststub"
            echo "VIRTUAL_USER0_GATE_OK"
            adb shell ps -A | grep -E "com.cloneapp.lite|top.niunaijun|blackbox" || true

            adb logcat -c
            adb shell am start -W -n com.cloneapp.teststub/.MainActivity --es marker CI-User0
            adb shell dumpsys activity activities | grep -q "com.cloneapp.teststub/.MainActivity"

            adb shell am start -W -n com.cloneapp.teststub/.SecondActivity --es marker CI-User0
            adb shell dumpsys activity activities | grep -q "com.cloneapp.teststub/.SecondActivity"

            adb shell am force-stop com.cloneapp.teststub
            adb shell am start -W -n com.cloneapp.teststub/.MainActivity --es marker CI-User0 --es action post_notification
            adb shell dumpsys notification --noredact | grep -q "com.cloneapp.teststub"

            adb shell am force-stop com.cloneapp.teststub
            adb shell am start -W -n com.cloneapp.teststub/.MainActivity --es marker CI-User0 --es action open_pdf
            sleep 1
            adb shell dumpsys activity activities | grep -q "com.cloneapp.teststub/.PdfViewerActivity"
            adb logcat -d -s CloneAppTestStub:I '*:S' | grep -q "TESTSTUB_PDF_OK"
