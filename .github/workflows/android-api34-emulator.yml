name: Android API 34 Emulator Foundation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api34-teststub-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build CloneApp Lite and deterministic test stub
        run: ./gradlew :app:assembleDebug :teststub:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 34 test-stub smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r teststub/build/outputs/apk/debug/teststub-debug.apk
            adb shell pm grant com.cloneapp.teststub android.permission.POST_NOTIFICATIONS

            echo "Installing CloneApp Lite universal APK"
            adb install -r "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*universal-debug.apk' -print -quit)"
            adb shell pm grant com.cloneapp.lite android.permission.POST_NOTIFICATIONS || true

            adb logcat -c
            adb shell am start -W -n com.cloneapp.lite/top.niunaijun.blackboxa.view.main.MainActivity
            sleep 2
            adb shell pidof com.cloneapp.lite
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: com\.cloneapp\.lite" >/dev/null; then
              echo "CloneApp Lite fatal crash detected during API 34 host launch"
              adb logcat -d | grep -E -A 25 "FATAL EXCEPTION|Process: com\.cloneapp\.lite"
              exit 1
            fi
            echo "CLONEAPP_API34_HOST_LAUNCH_OK"

            adb logcat -c
            adb shell am start -W -n com.cloneapp.teststub/.MainActivity --es marker CI-User0
            adb shell dumpsys activity activities | grep -q "com.cloneapp.teststub/.MainActivity"

            adb shell am start -W -n com.cloneapp.teststub/.SecondActivity --es marker CI-User0
            adb shell dumpsys activity activities | grep -q "com.cloneapp.teststub/.SecondActivity"

            adb shell am force-stop com.cloneapp.teststub
            adb shell am start -W -n com.cloneapp.teststub/.MainActivity --es marker CI-User0 --es action post_notification
            adb shell dumpsys notification --noredact | grep -q "com.cloneapp.teststub"

            adb shell am force-stop com.cloneapp.teststub
            adb shell am start -W -n com.cloneapp.teststub/.MainActivity --es marker CI-User0 --es action open_pdf
            sleep 1
            adb shell dumpsys activity activities | grep -q "com.cloneapp.teststub/.PdfViewerActivity"
            adb logcat -d -s CloneAppTestStub:I '*:S' | grep -q "TESTSTUB_PDF_OK"
