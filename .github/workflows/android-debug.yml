name: Android Debug APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLONEAPP_KEYSTORE_B64: ${{ secrets.CLONEAPP_KEYSTORE_B64 }}
      CLONEAPP_KEYSTORE_PASSWORD: ${{ secrets.CLONEAPP_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK 29.0.13846066
        shell: bash
        run: sdkmanager "ndk;29.0.13846066"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore persistent dev signing key
        if: ${{ env.CLONEAPP_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLONEAPP_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::CLONEAPP_KEYSTORE_PASSWORD is not configured"
            exit 1
          fi
          printf '%s' "$CLONEAPP_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cloneapp-dev.jks"
          chmod 600 "$RUNNER_TEMP/cloneapp-dev.jks"
          echo "CLONEAPP_KEYSTORE_PATH=$RUNNER_TEMP/cloneapp-dev.jks" >> "$GITHUB_ENV"

      - name: Report signing mode
        shell: bash
        run: |
          if [[ -n "${CLONEAPP_KEYSTORE_PATH:-}" ]]; then
            echo "Persistent dev signing: enabled"
          else
            echo "::warning::Persistent dev signing is not configured; using the runner's ephemeral debug key"
          fi

      - name: Run JVM regression gates
        run: ./gradlew testDebugUnitTest

      - name: Report CLF-9 receiver bridge regression evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          result_dir = Path("app/build/test-results/testDebugUnitTest")
          matches = list(result_dir.glob("TEST-*RegisteredReceiverBridgeRobolectricTest.xml"))
          if len(matches) != 1:
              print(f"CLF9_RECEIVER_GATE RED: expected exactly one JUnit XML, found {len(matches)}", file=sys.stderr)
              for match in matches:
                  print(f"  {match}", file=sys.stderr)
              sys.exit(1)

          root = ET.parse(matches[0]).getroot()
          tests = int(root.attrib.get("tests", "0"))
          failures = int(root.attrib.get("failures", "0"))
          errors = int(root.attrib.get("errors", "0"))
          skipped = int(root.attrib.get("skipped", "0"))
          suite_time = float(root.attrib.get("time", "0"))

          cases = root.findall("testcase")
          expected = {
              "screenOnPreservesFrameworkPendingResult",
              "screenOffPreservesFrameworkPendingResult",
              "userPresentPreservesFrameworkPendingResult",
              "connectivityChangePreservesFrameworkPendingResult",
              "proxyBroadcastUnwrapsTargetWithoutChangingCompletionIdentity",
              "goAsyncKeepsFrameworkPendingResultWithGuestAndPreventsEarlyFinish",
          }
          actual = {case.attrib.get("name", "") for case in cases}

          if tests != 6 or len(cases) != 6:
              print(f"CLF9_RECEIVER_GATE RED: expected 6 tests, XML reports tests={tests}, testcases={len(cases)}", file=sys.stderr)
              sys.exit(1)
          if failures != 0 or errors != 0 or skipped != 0:
              print(
                  f"CLF9_RECEIVER_GATE RED: failures={failures} errors={errors} skipped={skipped}",
                  file=sys.stderr,
              )
              sys.exit(1)
          if actual != expected:
              print(f"CLF9_RECEIVER_GATE RED: unexpected testcase set: {sorted(actual)}", file=sys.stderr)
              sys.exit(1)
          if suite_time <= 0:
              print(f"CLF9_RECEIVER_GATE RED: non-positive suite duration {suite_time}", file=sys.stderr)
              sys.exit(1)

          durations = []
          for case in cases:
              name = case.attrib.get("name", "")
              duration = float(case.attrib.get("time", "0"))
              if duration <= 0:
                  print(f"CLF9_RECEIVER_GATE RED: {name} has non-positive duration {duration}", file=sys.stderr)
                  sys.exit(1)
              durations.append((name, duration))

          print(
              f"CLF9_RECEIVER_GATE OK (6 tests) failures=0 errors=0 skipped=0 "
              f"suite_duration={suite_time:.3f}s"
          )
          for name, duration in sorted(durations):
              print(f"CLF9_RECEIVER_TEST {name} duration={duration:.3f}s")
          PY

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDebug :teststub:assembleDebug

      - name: Verify arm64-v8a APK
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*arm64-v8a*.apk' | grep -q .

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: cloneapp-lite-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload D1 clear-data test stub
        uses: actions/upload-artifact@v4
        with:
          name: cloneapp-lite-d1-teststub-apk
          path: teststub/build/outputs/apk/debug/teststub-debug.apk
          if-no-files-found: error
          retention-days: 14
