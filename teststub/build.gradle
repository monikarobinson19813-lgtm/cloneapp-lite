plugins {
    alias(libs.plugins.android.application)
}

def ciKeystorePath = System.getenv("CLONEAPP_KEYSTORE_PATH")
def ciKeystorePassword = System.getenv("CLONEAPP_KEYSTORE_PASSWORD")

android {
    namespace 'com.cloneapp.teststub'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.cloneapp.teststub"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (ciKeystorePath && ciKeystorePassword) {
            ciDev {
                storeFile file(ciKeystorePath)
                storePassword ciKeystorePassword
                keyAlias "cloneapp-dev"
                keyPassword ciKeystorePassword
            }
        }
    }

    buildTypes {
        debug {
            if (signingConfigs.findByName("ciDev") != null) {
                signingConfig signingConfigs.ciDev
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation libs.core.ktx
    androidTestImplementation libs.ext.junit
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
}
